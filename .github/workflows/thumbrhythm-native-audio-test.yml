name: ThumbRhythm Native Audio Test

on:
  push:
    branches: [ thumbrhythm-native-audio ]
    paths:
      - 'thumbrhythm-audio-test/**'
      - '.github/workflows/thumbrhythm-native-audio-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thumbrhythm-audio-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: yes | sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThumbRhythm-NativeAudioTest-unsigned
          path: thumbrhythm-audio-test/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
