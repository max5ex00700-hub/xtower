name: Build Wage Calculator APK

on:
  push:
    branches: [ wage-backup-fix ]
    paths:
      - 'wage-calculator/**'
      - '.github/workflows/build-wage-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wage-backup-fix

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Restore index.html
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p wage-calculator/app/src/main/assets
          cat wage-calculator/payload/index/* > /tmp/index.html.gz.b64
          base64 -d /tmp/index.html.gz.b64 > /tmp/index.html.gz
          gzip -t /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > wage-calculator/app/src/main/assets/index.html
          test -s wage-calculator/app/src/main/assets/index.html
          grep -q 'onShowFileChooser' wage-calculator/app/src/main/java/com/gongsu/calendar/MainActivity.java
          grep -q 'data:application/json;base64' wage-calculator/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p wage-calculator :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp wage-calculator/app/build/outputs/apk/debug/app-debug.apk global-wage-calculator-backup-fix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Global-Wage-Calculator-Backup-Fix-APK
          path: global-wage-calculator-backup-fix.apk
          if-no-files-found: error
