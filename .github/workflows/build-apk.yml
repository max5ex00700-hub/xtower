name: Build XTower Main UI v103
on:
  push:
    branches: [ main-ui-v103 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Create XTower v103 main page
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='XTower'
          include ':app'
          EOF
          mkdir -p app/src/main/java/com/xtower/game app/src/main/assets
          base64 -d assets/f1_base.b64 > app/src/main/assets/f1_base.webp
          test -s app/src/main/assets/f1_base.webp
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.xtower.game'; compileSdk 35
            defaultConfig { applicationId 'com.xtower.game'; minSdk 26; targetSdk 35; versionCode 103; versionName '9.30-main-ui' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.NoActionBar" android:label="X탑"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/xtower/game/MainActivity.java <<'EOF'
          package com.xtower.game;
          import android.app.*;import android.os.*;import android.graphics.*;import android.view.*;import android.content.*;import java.io.*;
          public class MainActivity extends Activity{
            public void onCreate(Bundle b){super.onCreate(b);getWindow().setStatusBarColor(Color.rgb(14,12,16));getWindow().setNavigationBarColor(Color.BLACK);setContentView(new GameView(this));}
          }
          class GameView extends View{
            Paint p=new Paint(3),stroke=new Paint(3); Bitmap hero; RectF[] btn=new RectF[8]; int mode=0; long flashUntil=0;
            String[] names={"공격","다시","아래","위","배낭","대장간","감옥","도감"};
            GameView(Context c){super(c);stroke.setStyle(Paint.Style.STROKE);stroke.setStrokeWidth(2);for(int i=0;i<8;i++)btn[i]=new RectF();try{hero=BitmapFactory.decodeStream(c.getAssets().open("f1_base.webp"));}catch(Exception e){} }
            void txt(Canvas c,String s,float x,float y,float size,int color,boolean bold){p.setStyle(Paint.Style.FILL);p.setColor(color);p.setTextSize(size);p.setTypeface(Typeface.create("sans",bold?Typeface.BOLD:Typeface.NORMAL));c.drawText(s,x,y,p);}
            void centerTxt(Canvas c,String s,float x,float y,float size,int color){p.setTextAlign(Paint.Align.CENTER);txt(c,s,x,y,size,color,true);p.setTextAlign(Paint.Align.LEFT);}
            void round(Canvas c,RectF r,int color,float rad){p.setColor(color);p.setStyle(Paint.Style.FILL);c.drawRoundRect(r,rad,rad,p);}
            void button(Canvas c,RectF r,String s,boolean hot){round(c,r,hot?Color.rgb(104,42,58):Color.rgb(43,29,35),18);stroke.setColor(hot?Color.rgb(180,77,101):Color.rgb(89,55,68));c.drawRoundRect(r,18,18,stroke);centerTxt(c,s,r.centerX(),r.centerY()+9,24,Color.rgb(240,221,225));}
            void cover(Canvas c,RectF dst){if(hero==null){p.setColor(Color.rgb(37,38,44));c.drawRect(dst,p);txt(c,"IMAGE LOAD ERROR",24,dst.top+44,22,Color.RED,true);return;}float sr=(float)hero.getWidth()/hero.getHeight(),dr=dst.width()/dst.height();Rect src;if(sr>dr){int sw=(int)(hero.getHeight()*dr);int l=(hero.getWidth()-sw)/2;src=new Rect(l,0,l+sw,hero.getHeight());}else{int sh=(int)(hero.getWidth()/dr);int t=(hero.getHeight()-sh)/2;src=new Rect(0,t,hero.getWidth(),t+sh);}c.drawBitmap(hero,src,dst,p);}
            protected void onDraw(Canvas c){super.onDraw(c);float w=getWidth(),h=getHeight();c.drawColor(Color.rgb(15,12,16));if(mode==1){cover(c,new RectF(0,0,w,h));if(System.currentTimeMillis()<flashUntil){p.setColor(Color.argb(80,255,255,255));c.drawRect(0,0,w,h,p);postInvalidateOnAnimation();}return;}float topH=218;txt(c,"아이린",18,52,34,Color.rgb(236,196,211),false);txt(c,"희미한 탑",18,88,20,Color.rgb(187,156,169),false);round(c,new RectF(18,108,w-18,124),Color.rgb(72,38,52),12);round(c,new RectF(18,108,w-18,124),Color.rgb(234,153,183),12);txt(c,"체력 100%",18,154,18,Color.rgb(205,176,188),false);txt(c,"1-1  체력 6286/6286  힘 1553  방어 775",18,194,21,Color.rgb(196,165,178),false);
              RectF img=new RectF(0,topH,w,h-332);cover(c,img);
              float y=h-310,g=10,margin=20,bw=(w-margin*2-g*3)/4f,bh=66;for(int r=0;r<2;r++)for(int col=0;col<4;col++){int i=r*4+col;float x=margin+col*(bw+g),yy=y+r*(bh+10);btn[i].set(x,yy,x+bw,yy+bh);button(c,btn[i],names[i],i==0);}txt(c,"1-1  배율 x1.0  체력 40  힘 8  방 2",18,h-118,17,Color.rgb(157,122,137),false);
            }
            public boolean onTouchEvent(MotionEvent e){if(e.getAction()!=MotionEvent.ACTION_UP)return true;float x=e.getX(),y=e.getY();if(mode==1){flashUntil=System.currentTimeMillis()+130;invalidate();return true;}for(int i=0;i<8;i++)if(btn[i].contains(x,y)){if(i==0){mode=1;invalidate();}return true;}return true;}
          }
          EOF
      - name: Verify packaged image
        run: |
          file app/src/main/assets/f1_base.webp
          test "$(stat -c%s app/src/main/assets/f1_base.webp)" -gt 10000
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: XTower-v103-main-ui-apk
          path: app/build/outputs/apk/debug/app-debug.apk
