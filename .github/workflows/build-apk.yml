name: Build XTower APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Restore bundled game assets
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/raw /tmp/xtower-assets
          cat assets_parts/p* > /tmp/xtower-assets.b64
          base64 -d /tmp/xtower-assets.b64 > /tmp/xtower-assets.zip
          unzip -t /tmp/xtower-assets.zip
          unzip -o /tmp/xtower-assets.zip -d /tmp/xtower-assets
          cp /tmp/xtower-assets/s0.jpg app/src/main/res/drawable-nodpi/s0.jpg
          cp /tmp/xtower-assets/s1.jpg app/src/main/res/drawable-nodpi/s1.jpg
          cp /tmp/xtower-assets/s2.jpg app/src/main/res/drawable-nodpi/s2.jpg
          cp /tmp/xtower-assets/s3.jpg app/src/main/res/drawable-nodpi/s3.jpg
          cp /tmp/xtower-assets/s4.jpg app/src/main/res/drawable-nodpi/s4.jpg
          cp /tmp/xtower-assets/hit.ogg app/src/main/res/raw/hit.ogg
          cp /tmp/xtower-assets/hurt.ogg app/src/main/res/raw/hurt.ogg
          cp /tmp/xtower-assets/sparkle.ogg app/src/main/res/raw/sparkle.ogg
          cp /tmp/xtower-assets/win.ogg app/src/main/res/raw/win.ogg
          ls -lh app/src/main/res/drawable-nodpi app/src/main/res/raw
      - name: Patch Java compiler issue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/xtower/game/MainActivity.java')
          s=p.read_text()
          start=s.index('        void drawBubble(')
          end=s.index('\n\n        void drawAttackFx', start)
          fixed='''        void drawBubble(Canvas c,long now,boolean mad){
              int w=getWidth();
              float left=w*0.08f;
              float right=w*0.92f;
              float top=getHeight()*0.06f;
              p.setColor(mad?0xff3a1418:0xfffff6ea);
              RectF bubbleBox=new RectF(left,top,right,top+92);
              c.drawRoundRect(bubbleBox,18,18,p);
              if(mad){
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(2);
                  p.setColor(0xffc45c6a);
                  c.drawRoundRect(bubbleBox,18,18,p);
                  p.setStyle(Paint.Style.FILL);
              }
              drawWrapped(c,bubbleText,left+16,top+28,right-left-32,15,mad?0xffffd6dc:0xff3a2428);
          }'''
          p.write_text(s[:start]+fixed+s[end:])
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XTower.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XTower-APK
          path: XTower.apk
          if-no-files-found: error
