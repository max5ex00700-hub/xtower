name: Build XTower Main UI v105
on:
  push:
    branches: [ main-ui-v103 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.2.1' }
      - name: Create XTower v105
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='XTower'; include ':app'
          EOF
          mkdir -p app/src/main/java/com/xtower/game app/src/main/assets
          base64 -d assets/f1_base.b64 > app/src/main/assets/f1_base.webp
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.xtower.game'; compileSdk 35
            defaultConfig { applicationId 'com.xtower.game'; minSdk 26; targetSdk 35; versionCode 105; versionName '9.32' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.NoActionBar" android:label="X탑"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/xtower/game/MainActivity.java <<'EOF'
          package com.xtower.game;
          import android.app.*;import android.os.*;import android.graphics.*;import android.view.*;import android.content.*;
          public class MainActivity extends Activity{public void onCreate(Bundle b){super.onCreate(b);getWindow().setStatusBarColor(Color.rgb(13,10,14));setContentView(new GameView(this));}}
          class GameView extends View{
            Paint p=new Paint(3),s=new Paint(3);Bitmap hero;RectF[] b=new RectF[8];String[] n={"공격","다시","아래","위","배낭","대장간","감옥","도감"};int mode=0;
            GameView(Context c){super(c);s.setStyle(Paint.Style.STROKE);for(int i=0;i<8;i++)b[i]=new RectF();try{hero=BitmapFactory.decodeStream(c.getAssets().open("f1_base.webp"));}catch(Exception e){}}
            void t(Canvas c,String x,float a,float y,float z,int col){p.setColor(col);p.setTextSize(z);p.setTypeface(Typeface.create("sans",Typeface.BOLD));c.drawText(x,a,y,p);}void box(Canvas c,RectF r,int col,float rad){p.setColor(col);c.drawRoundRect(r,rad,rad,p);}
            void bt(Canvas c,RectF r,String x,boolean hot){p.setShadowLayer(15,0,5,Color.BLACK);setLayerType(LAYER_TYPE_SOFTWARE,p);box(c,r,hot?Color.rgb(118,35,61):Color.rgb(35,25,31),24);p.clearShadowLayer();s.setColor(hot?Color.rgb(246,137,170):Color.rgb(111,76,91));s.setStrokeWidth(hot?3.5f:2.4f);c.drawRoundRect(r,24,24,s);p.setTextAlign(Paint.Align.CENTER);t(c,x,r.centerX(),r.centerY()+11,29,Color.WHITE);p.setTextAlign(Paint.Align.LEFT);}
            void pic(Canvas c,RectF d){if(hero==null){p.setColor(Color.DKGRAY);c.drawRect(d,p);return;}float sr=(float)hero.getWidth()/hero.getHeight(),dr=d.width()/d.height();Rect q;if(sr>dr){int w=(int)(hero.getHeight()*dr),l=(hero.getWidth()-w)/2;q=new Rect(l,0,l+w,hero.getHeight());}else{int h=(int)(hero.getWidth()/dr),u=(hero.getHeight()-h)/2;q=new Rect(0,u,hero.getWidth(),u+h);}c.drawBitmap(hero,q,d,p);}
            protected void onDraw(Canvas c){float w=getWidth(),h=getHeight();c.drawColor(Color.rgb(14,10,15));if(mode==1){pic(c,new RectF(0,0,w,h));return;}float y=28;RectF card=new RectF(12,y,w-12,y+244);box(c,card,Color.rgb(23,15,22),22);s.setColor(Color.rgb(94,55,73));s.setStrokeWidth(2);c.drawRoundRect(card,22,22,s);t(c,"아이린",27,y+51,44,Color.rgb(250,207,224));t(c,"희미한 탑",28,y+88,23,Color.rgb(199,158,175));t(c,"적 체력",28,y+129,21,Color.rgb(225,190,205));t(c,"100 / 100",w-155,y+129,21,Color.rgb(249,209,225));box(c,new RectF(28,y+145,w-28,y+170),Color.rgb(69,37,50),13);box(c,new RectF(28,y+145,w-28,y+170),Color.rgb(238,147,181),13);t(c,"1-1",28,y+215,29,Color.WHITE);t(c,"체력 100",104,y+215,25,Color.rgb(232,204,215));t(c,"공격 3",260,y+215,25,Color.rgb(232,204,215));t(c,"방어 1",390,y+215,25,Color.rgb(232,204,215));RectF im=new RectF(0,y+260,w,h-264);pic(c,im);float yy=h-250,g=11,m=14,bw=(w-m*2-g*3)/4f,bh=91;for(int r=0;r<2;r++)for(int j=0;j<4;j++){int i=r*4+j;float x=m+j*(bw+g),cy=yy+r*(bh+11);b[i].set(x,cy,x+bw,cy+bh);bt(c,b[i],n[i],i==0);}t(c,"1-1 장비 기본 총합 1",20,h-27,21,Color.rgb(202,158,177));}
            public boolean onTouchEvent(MotionEvent e){if(e.getAction()!=1)return true;float x=e.getX(),y=e.getY();if(mode==1)return true;for(int i=0;i<8;i++)if(b[i].contains(x,y)){if(i==0){mode=1;invalidate();}return true;}return true;}
          }
          EOF
      - name: Verify image
        run: test "$(stat -c%s app/src/main/assets/f1_base.webp)" -gt 10000
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: XTower-v932-apk, path: app/build/outputs/apk/debug/app-debug.apk }
