name: Build XTower APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Restore bundled game assets
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/raw /tmp/xtower-assets
          cat assets_parts/p* > /tmp/xtower-assets.b64
          base64 -d /tmp/xtower-assets.b64 > /tmp/xtower-assets.zip
          unzip -t /tmp/xtower-assets.zip
          unzip -o /tmp/xtower-assets.zip -d /tmp/xtower-assets
          cp /tmp/xtower-assets/s0.jpg app/src/main/res/drawable-nodpi/s0.jpg
          cp /tmp/xtower-assets/s1.jpg app/src/main/res/drawable-nodpi/s1.jpg
          cp /tmp/xtower-assets/s2.jpg app/src/main/res/drawable-nodpi/s2.jpg
          cp /tmp/xtower-assets/s3.jpg app/src/main/res/drawable-nodpi/s3.jpg
          cp /tmp/xtower-assets/s4.jpg app/src/main/res/drawable-nodpi/s4.jpg
          cp /tmp/xtower-assets/hit.ogg app/src/main/res/raw/hit.ogg
          cp /tmp/xtower-assets/hurt.ogg app/src/main/res/raw/hurt.ogg
          cp /tmp/xtower-assets/sparkle.ogg app/src/main/res/raw/sparkle.ogg
          cp /tmp/xtower-assets/win.ogg app/src/main/res/raw/win.ogg
          ls -lh app/src/main/res/drawable-nodpi app/src/main/res/raw
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XTower.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XTower-APK
          path: XTower.apk
          if-no-files-found: error
