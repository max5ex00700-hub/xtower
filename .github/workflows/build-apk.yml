name: Build XTower APK
on:
  push:
    branches: [ build-pipeline2 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Create Android project
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='XTower'
          include ':app'
          EOF
          mkdir -p app/src/main/java/com/xtower/game
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.xtower.game'; compileSdk 35
            defaultConfig { applicationId 'com.xtower.game'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.NoActionBar" android:label="X탑"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/xtower/game/MainActivity.java <<'EOF'
          package com.xtower.game;
          import android.app.*;import android.os.*;import android.graphics.*;import android.view.*;
          public class MainActivity extends Activity{
            public void onCreate(Bundle b){super.onCreate(b);setContentView(new V());}
            class V extends View{Paint p=new Paint(1);V(){super(MainActivity.this);p.setTextSize(48);}
              protected void onDraw(Canvas c){c.drawColor(Color.rgb(15,15,18));p.setColor(Color.WHITE);c.drawText("X탑 빌드 파이프라인 성공",40,100,p);p.setTextSize(32);c.drawText("다음: 전체 엔진 + 빠칭코 연결",40,160,p);}}
          }
          EOF
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: xtower-apk
          path: app/build/outputs/apk/debug/app-debug.apk
