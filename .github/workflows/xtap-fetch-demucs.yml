name: XTap Fetch Demucs 6s Model

on:
  push:
    branches:
      - xtap-demucs-model
    paths:
      - '.github/workflows/xtap-fetch-demucs.yml'

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download htdemucs_6s model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p model
          curl -L --fail --retry 3 --retry-delay 2             -o model/5c90dfd2-34c22ccb.th             'https://huggingface.co/lainlives/audio-separator-models/resolve/main/5c90dfd2-34c22ccb.th?download=true'
          echo '34c22ccb381c6f9fdbf324f04e1e2fe21aaaf293f5ded163a162697ff9a02ddd  model/5c90dfd2-34c22ccb.th' | sha256sum -c -
          ls -lh model/5c90dfd2-34c22ccb.th

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: htdemucs-6s-model
          path: model/5c90dfd2-34c22ccb.th
          compression-level: 0
          retention-days: 1
