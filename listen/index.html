<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="description" content="링크 하나로 같은 노래를 같은 순간에 — 실시간 동기화 같이 듣기 플레이어">
<title>같이 듣기 · 포시즌jo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#07080c;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --txt:#f2f4f8;
    --dim:#8d94a7;
    --a1:#5eead4;
    --a2:#8b8bff;
    --a3:#f472b6;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--txt);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Helvetica Neue",Arial,"Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 70% at 8% -10%, rgba(139,139,255,.26), transparent 60%),
      radial-gradient(90% 60% at 100% 2%, rgba(94,234,212,.14), transparent 62%),
      radial-gradient(120% 80% at 50% 115%, rgba(244,114,182,.16), transparent 65%);
    filter:saturate(1.05);
    animation:auroraBreath 13s ease-in-out infinite;
    animation-play-state:paused;
    will-change:transform,opacity;
  }
  /* 재생 중일 때만 밤하늘/오로라가 아주 천천히 숨 쉰다 */
  body.playing::before{animation-play-state:running}
  @keyframes auroraBreath{
    0%,100%{opacity:.96;transform:scale(1)}
    50%{opacity:1;transform:scale(1.07) translateY(-1%)}
  }
  .app{
    position:relative;z-index:1;
    height:100dvh;height:100svh;
    display:flex;flex-direction:column;
    gap:10px;
    padding:calc(12px + var(--safe-t)) 16px calc(10px + var(--safe-b));
    max-width:520px;margin:0 auto;
    overflow:hidden;
  }

  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(150deg,rgba(94,234,212,.22),rgba(139,139,255,.28));
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 6px 18px rgba(90,90,200,.22), inset 0 1px 0 rgba(255,255,255,.14);
  }
  h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
  .sub{margin:2px 0 0;font-size:11px;color:var(--dim);letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .presence{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:600;color:#bdf5e6;
    padding:7px 10px;border-radius:999px;
    background:rgba(94,234,212,.10);border:1px solid rgba(94,234,212,.24);
    transition:background .3s,border-color .3s,color .3s;
  }
  .presence b{font-weight:800;color:#5eead4;margin-left:1px}
  .presence .pw{white-space:nowrap}
  .presence.solo .pw{display:none}
  .presence.duo{background:linear-gradient(100deg,rgba(94,234,212,.16),rgba(139,139,255,.2));border-color:rgba(167,243,232,.34)}
  @media (max-width:370px){ .presence{font-size:10.5px;padding:6px 8px} .presence .pw{display:none} }
  .dot{width:6px;height:6px;border-radius:50%;background:#5eead4;box-shadow:0 0 0 0 rgba(94,234,212,.6);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,234,212,.55)}70%{box-shadow:0 0 0 7px rgba(94,234,212,0)}100%{box-shadow:0 0 0 0 rgba(94,234,212,0)}}
  .presence.offline{color:#ffd6a8;background:rgba(255,180,80,.10);border-color:rgba(255,180,80,.3)}
  .presence.offline .dot{background:#ffb450;animation:none}

  /* ---------- now playing card ---------- */
  .now{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;gap:11px;
    padding:13px 13px 15px;border-radius:24px;
    background:var(--card);
    border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 44px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .art{
    position:relative;flex:1 1 auto;min-height:118px;
    border-radius:18px;overflow:hidden;
    background:
      radial-gradient(120% 100% at 50% 120%, rgba(60,40,90,.55), transparent 62%),
      linear-gradient(180deg,#0d1018,#0a0b12 60%,#0b0c14);
    border:1px solid rgba(255,255,255,.09);
    display:grid;place-items:center;
  }
  /* 밤하늘 별가루 */
  .art::before{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      radial-gradient(1.2px 1.2px at 18% 22%, rgba(255,255,255,.85), transparent 100%),
      radial-gradient(1px 1px at 32% 68%, rgba(255,255,255,.6), transparent 100%),
      radial-gradient(1.4px 1.4px at 61% 17%, rgba(255,255,255,.75), transparent 100%),
      radial-gradient(1px 1px at 78% 42%, rgba(255,255,255,.5), transparent 100%),
      radial-gradient(1.2px 1.2px at 88% 74%, rgba(255,255,255,.6), transparent 100%),
      radial-gradient(1px 1px at 9% 58%, rgba(255,255,255,.45), transparent 100%),
      radial-gradient(1.1px 1.1px at 46% 88%, rgba(255,255,255,.5), transparent 100%);
  }
  /* 하단 비네트 */
  .art::after{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 34%,rgba(0,0,0,.34));
  }

  /* ---------- 함께 듣는 오라 ---------- */
  .aura{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;mix-blend-mode:screen}
  .aura .orb{
    position:absolute;top:50%;left:50%;width:172px;height:172px;margin:-86px 0 0 -86px;
    border-radius:50%;filter:blur(19px) saturate(1.15);opacity:.7;
    transition:left .95s cubic-bezier(.3,.9,.3,1),opacity .7s ease;
    animation:breathe 6.8s ease-in-out infinite;will-change:transform,opacity;
  }
  .aura .orb.me{background:radial-gradient(circle at 50% 50%, rgba(170,255,240,1), rgba(94,234,212,.55) 42%, rgba(45,212,191,0) 72%)}
  .aura .orb.peer{background:radial-gradient(circle at 50% 50%, rgba(225,210,255,1), rgba(139,139,255,.55) 42%, rgba(244,114,182,0) 74%);animation-delay:.7s;animation-duration:7.1s;opacity:0}
  .aura .orb::after{
    content:"";position:absolute;inset:-6%;border-radius:50%;
    border:1px solid rgba(255,255,255,.24);opacity:0;
    animation:orbRing 5.6s ease-out infinite;
  }
  .aura .orb.peer::after{animation-delay:2.4s}
  @keyframes breathe{
    0%,100%{transform:scale(.88);opacity:.55}
    50%{transform:scale(1.12);opacity:1}
  }
  @keyframes orbRing{
    0%{transform:scale(.86);opacity:.42}
    70%{opacity:0}
    100%{transform:scale(1.42);opacity:0}
  }
  /* 나 · 상대 두 빛 */
  .art.duo .aura .orb.me{left:17%}
  .art.duo .aura .orb.peer{left:83%;opacity:1}
  .art:not(.duo) .aura .orb.me{left:50%}

  /* 두 빛을 잇는 빛의 다리 */
  .bridge{
    position:absolute;inset:0;width:100%;height:100%;z-index:3;
    opacity:0;transition:opacity .9s ease;pointer-events:none;
    mix-blend-mode:screen;
  }
  .art.duo .bridge{opacity:.8}
  .bridge path{
    fill:none;stroke-width:1.7;stroke-linecap:round;
    vector-effect:non-scaling-stroke;
    animation:bridgeGlow 5.4s ease-in-out infinite;
  }
  .bridge .b2{animation-delay:1.6s}
  @keyframes bridgeGlow{0%,100%{opacity:.22}50%{opacity:.95}}

  /* ---------- 바이닐 ---------- */
  .vinyl{
    position:relative;z-index:2;
    height:62%;max-height:212px;min-height:92px;aspect-ratio:1/1;width:auto;
    border-radius:50%;
    background:
      radial-gradient(circle at 34% 24%, rgba(255,255,255,.10), rgba(255,255,255,0) 42%),
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.055) 0 1.4px, rgba(0,0,0,0) 1.4px 7px),
      radial-gradient(circle at 50% 50%, #1a1c28 0%, #0c0d14 62%, #07080d 100%);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:inset 0 0 60px rgba(0,0,0,.5), 0 14px 40px rgba(0,0,0,.45), 0 0 40px rgba(120,120,255,.14);
    display:grid;place-items:center;
    animation:spin 9s linear infinite;animation-play-state:paused;
    will-change:transform;
  }
  .art.playing .vinyl{animation-play-state:running}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .vinyl .label{
    width:34%;height:34%;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(94,234,212,.62),rgba(139,139,255,.68) 58%,rgba(244,114,182,.55));
    box-shadow:0 0 26px rgba(140,140,255,.45), inset 0 1px 0 rgba(255,255,255,.45);
    font-size:25px;
    animation:spinBack 9s linear infinite;animation-play-state:paused;
  }
  .art.playing .vinyl .label{animation-play-state:running}
  @keyframes spinBack{from{transform:rotate(0)}to{transform:rotate(-360deg)}}

  .badge{
    position:absolute;top:9px;left:9px;z-index:4;
    font-size:10.5px;font-weight:700;letter-spacing:.3px;
    padding:5px 9px;border-radius:999px;
    background:rgba(7,8,12,.5);border:1px solid rgba(255,255,255,.16);
    color:#e8ecf5;backdrop-filter:blur(6px);
  }
  .together{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:4;
    max-width:calc(100% - 20px);
    font-size:10.5px;font-weight:600;letter-spacing:-.1px;line-height:1.2;
    padding:6px 11px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:#e6ebf6;
    background:rgba(7,8,12,.44);border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    transition:border-color .5s,color .5s,background .5s;
  }
  .art.duo .together{
    color:#fff;
    background:linear-gradient(100deg,rgba(94,234,212,.17),rgba(139,139,255,.24));
    border-color:rgba(167,243,232,.36);
    box-shadow:0 0 22px rgba(120,120,255,.22);
  }

  .meta{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;min-width:0}
  .title{
    margin:0;font-size:16px;font-weight:700;letter-spacing:-.25px;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hint{margin:0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .seek{flex:0 0 auto}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;display:block;
    --p:0%;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px;border-radius:99px;
    background:linear-gradient(90deg,var(--a1),var(--a2)) 0/var(--p) 100% no-repeat, rgba(255,255,255,.13);
  }
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.13)}
  input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2))}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;margin-top:-4.5px;border-radius:50%;
    background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);border:0;
  }
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  input[type=range]:disabled{opacity:.45}
  .times{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:-2px;letter-spacing:.2px}

  .controls{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:20px}
  .ctl{
    appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#dfe4ef;
    width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s;
    font-variant-numeric:tabular-nums;
  }
  .ctl:active{transform:scale(.93);background:rgba(255,255,255,.12)}
  .ctl svg{width:20px;height:20px;display:block}
  .play{
    appearance:none;border:0;cursor:pointer;position:relative;
    width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--a1),var(--a2) 62%,var(--a3));
    color:#0a0b12;box-shadow:0 10px 26px rgba(120,120,255,.38), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s,box-shadow .25s,opacity .2s;
  }
  .play:active{transform:scale(.94)}
  .play:disabled{opacity:.4;box-shadow:none;cursor:default}
  .play svg{width:25px;height:25px}
  .play .i-play{display:block}
  .play.is-playing .i-play{display:none}
  .play.is-playing .i-pause{display:block}
  .play .i-pause{display:none}

  /* ---------- 감성 리액션 ---------- */
  .reactions{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px}
  .react{
    appearance:none;cursor:pointer;width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;font-size:17px;line-height:1;font-family:inherit;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);
    transition:transform .12s,background .2s,border-color .2s,box-shadow .2s;
  }
  .react:hover{background:rgba(255,255,255,.1)}
  .react:active{transform:scale(.88);background:rgba(255,255,255,.16);border-color:rgba(120,200,255,.5);box-shadow:0 0 16px rgba(140,180,255,.35)}
  .react:focus-visible{outline:2px solid rgba(143,162,255,.8);outline-offset:2px}

  /* ---------- 떠오르는 리액션 파티클 ---------- */
  .floaters{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
  .float{
    position:absolute;transform:translate(-50%,-50%);
    font-size:23px;line-height:1;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(170,190,255,.45));
    animation:floatUp 2.8s cubic-bezier(.22,.7,.35,1) forwards;
    will-change:transform,opacity;
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.45) rotate(-6deg)}
    14%{opacity:1;transform:translate(calc(-50% + var(--dx)*.18),calc(-50% - 14px)) scale(1.14) rotate(4deg)}
    70%{opacity:.9}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 172px)) scale(var(--sc)) rotate(-8deg)}
  }

  /* ---------- actions ---------- */
  .actions{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
  .btn{
    appearance:none;cursor:pointer;width:100%;
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 12px;border-radius:14px;
    font-size:13.5px;font-weight:700;letter-spacing:-.2px;font-family:inherit;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);color:#eef1f8;
    transition:transform .12s,background .2s,border-color .2s,opacity .2s;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{
    border:1px solid rgba(255,255,255,.2);
    background:linear-gradient(100deg,rgba(94,234,212,.2),rgba(139,139,255,.26));
    box-shadow:0 8px 22px rgba(90,90,200,.2), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .row{display:flex;gap:7px}
  .row .btn{flex:1 1 0;min-width:0;padding:11px 6px;font-size:12px;letter-spacing:-.3px}
  .btn.mini{background:rgba(255,255,255,.04)}
  .btn:disabled{opacity:.38;cursor:default}
  .btn.busy{background:linear-gradient(100deg,rgba(94,234,212,.14),rgba(139,139,255,.2));border-color:rgba(167,243,232,.32)}
  .spin{
    width:12px;height:12px;flex:0 0 12px;border-radius:50%;
    border:2px solid rgba(255,255,255,.28);border-top-color:#bfefff;
    animation:rot .7s linear infinite;
  }
  @keyframes rot{to{transform:rotate(360deg)}}

  .code-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;color:#a9b0c4;font-weight:600;letter-spacing:.4px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    padding:5px 9px;border-radius:8px;
  }
  .chip b{color:#e7ebf4;letter-spacing:1.6px;font-weight:800}
  .linkish{appearance:none;background:none;border:0;color:#8fa2ff;font-size:11px;font-weight:700;font-family:inherit;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(143,162,255,.4)}

  .upload{display:none;flex-direction:column;gap:5px;padding:2px 2px 0}
  .upload.on{display:flex}
  .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .18s}
  .up-text{margin:0;font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .up-text span:last-child{font-variant-numeric:tabular-nums;color:#b9c0d2}

  /* ---------- footer ---------- */
  footer{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;padding-bottom:2px}
  .tip{
    margin:0;font-size:10.5px;line-height:1.4;color:#7f879b;letter-spacing:-.1px;
    display:flex;gap:6px;align-items:flex-start;
  }
  .tip em{font-style:normal;color:#9aa3ba}
  .credit{margin:0;text-align:center;font-size:10px;letter-spacing:.5px;color:#565e72}

  /* ---------- overlay ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(5,6,10,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .overlay.on{display:flex}
  .overlay .box{
    width:100%;max-width:330px;text-align:center;
    padding:26px 20px 22px;border-radius:22px;
    background:linear-gradient(170deg,rgba(30,32,48,.96),rgba(14,15,23,.98));
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    animation:pop .28s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .overlay .big{font-size:34px;margin-bottom:10px}
  .overlay h2{margin:0 0 6px;font-size:16px;letter-spacing:-.3px}
  .overlay p{margin:0 0 18px;font-size:12px;color:var(--dim);line-height:1.5}
  .overlay .go{
    width:100%;padding:14px;border-radius:14px;border:0;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:800;color:#080a10;
    background:linear-gradient(100deg,var(--a1),var(--a2) 70%,var(--a3));
    box-shadow:0 10px 26px rgba(120,120,255,.35);
  }
  .overlay .go:active{transform:scale(.98)}
  .overlay .skip{margin-top:10px;background:none;border:0;color:#7f879b;font-size:11.5px;font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* ---------- join sheet ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
  .sheet.on{display:flex}
  .sheet .panel{
    width:100%;max-width:520px;margin:0 auto;
    background:#12141d;border-radius:20px 20px 0 0;
    border-top:1px solid rgba(255,255,255,.12);
    padding:18px 18px calc(20px + var(--safe-b));
    animation:up .26s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:0 0 4px;font-size:14px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  /* ============ config ============ */
  var SUPABASE_URL = 'https://hjjecidahdzubmguaqge.supabase.co';

    realtime: { params: { eventsPerSecond: 20 } }
  });

  /* ============ elements ============ */
  var $ = function (id) { return document.getElementById(id); };
  var audio = $('au'), seek = $('seek'), curEl = $('cur'), durEl = $('dur');
  var titleEl = $('title'), hintEl = $('hint'), art = $('art'), glyph = $('glyph');
  var playBtn = $('play'), pcEl = $('pc'), presenceEl = $('presence'), badge = $('badge');
  var fileInput = $('file'), uploadBox = $('upload'), barfill = $('barfill');
  var uptext = $('uptext'), uppct = $('uppct');
  var unlockOv = $('unlock'), toastEl = $('toast');
  var saveBtn = $('save'), reactRow = $('reacts'), floaters = $('floaters'), togetherEl = $('together');

  /* ============ room + identity ============ */
  function makeCode(n) {
    var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < n; i++) s += A.charAt(Math.floor(Math.random() * A.length));
    return s;
  }
  var params = new URLSearchParams(location.search);
  var room = (params.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  if (room.length < 4) {
    room = makeCode(6);
    var u = new URL(location.href);
    u.searchParams.set('room', room);
    history.replaceState(null, '', u.toString());
  }
  var clientId = 'c_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  var joinedAt = Date.now();
  $('code').textContent = room;

  function shareLink() {
    return location.origin + location.pathname + '?room=' + room;
  }

  /* ============ player state ============ */
  var state = {
    url: '',
    title: '',
    playing: false,
    pos: 0,          // position (s) valid at `at`
    at: 0            // local Date.now() when pos was valid
  };
  var pendingSeek = null;     // seconds to apply once metadata is ready
  var hasTrack = false;
  var unlocked = false;       // a user gesture already allowed playback
  var scrubbing = false;
  var seq = 0;                // our command sequence
  var peerSeq = {};           // clientId -> last seen seq
  var lastBeatAt = 0;
  var leaderId = null;
  var gotState = false;
  var subscribed = false;
  var sendQueue = [];
  var prevCount = 0;
  var trackFromPeer = false;   // 이 곡이 상대방에서 왔는지 (환영 문구용)

  function nowPos() {
    if (!state.playing) return state.pos;
    return state.pos + (Date.now() - state.at) / 1000;
  }
  function setWant(playing, pos) {
    state.playing = playing;
    state.pos = pos;
    state.at = Date.now();
  }
  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function cleanName(name) {
    return (name || '음악').replace(/\.[a-z0-9]{2,5}$/i, '').replace(/[_]+/g, ' ').trim().slice(0, 80) || '음악';
  }

  /* ============ realtime channel ============ */
  var channel = sb.channel('room:' + room, {
    config: { broadcast: { self: false }, presence: { key: clientId } }
  });

  function send(event, payload) {
    var msg = { type: 'broadcast', event: event, payload: payload };
    if (!subscribed) { if (sendQueue.length < 20) sendQueue.push(msg); return; }
    channel.send(msg).catch(function () {});
  }

  function broadcastState(action, extra) {
    var p = {
      action: action,
      url: state.url,
      title: state.title,
      playing: state.playing,
      position: Math.max(0, audio.currentTime || state.pos || 0),
      sentAt: Date.now(),
      seq: ++seq,
      clientId: clientId
    };
    if (extra) for (var k in extra) p[k] = extra[k];
    send('cmd', p);
  }

  function computeLeader() {
    var st = channel.presenceState() || {};
    var best = null;
    Object.keys(st).forEach(function (key) {
      var metas = st[key] || [];
      var m = metas[0] || {};
      var t = m.joinedAt || Infinity;
      if (!best || t < best.t || (t === best.t && key < best.k)) best = { k: key, t: t };
    });
    leaderId = best ? best.k : null;
  }

  function updatePresence() {
    var st = channel.presenceState() || {};
    var n = 0;
    Object.keys(st).forEach(function (k) { if ((st[k] || []).length) n++; });
    n = Math.max(1, n);
    pcEl.textContent = n;
    presenceEl.title = '같은 방에 ' + n + '명';

    // 함께 듣는 오라: 1명이면 단일 글로우, 2명 이상이면 두 빛 + 빛의 다리
    var duo = n > 1;
    art.classList.toggle('duo', duo);
    presenceEl.classList.toggle('duo', duo);
    presenceEl.classList.toggle('solo', !duo);
    togetherEl.textContent = duo
      ? '✨ ' + n + '명이 같은 순간을 함께 듣는 중'
      : '🌙 혼자 조용히 듣는 중';

    if (duo && prevCount && n > prevCount) toast('✨ 함께 듣는 사람이 연결됐어요');
    prevCount = n;

    computeLeader();
  }

  channel.on('presence', { event: 'sync' }, updatePresence);
  channel.on('presence', { event: 'join' }, function () {
    updatePresence();
    if (hasTrack) setTimeout(requestState, 350);
  });
  channel.on('presence', { event: 'leave' }, updatePresence);

  function requestState() {
    send('state_req', { from: clientId, at: Date.now() });
  }

  channel.on('broadcast', { event: 'state_req' }, function (m) {
    var p = (m && m.payload) || {};
    if (p.from === clientId) return;
    var isLeader = (leaderId === clientId);
    if (isLeader) {
      replyState(p.from);
    } else if (hasTrack) {
      // leader may not be around: answer too, a bit later, only if nobody answered
      setTimeout(function () { if (!gotState) replyState(p.from); }, 600);
    }
  });

  function replyState(to) {
    if (!hasTrack) return;
    send('state', {
      to: to, from: clientId,
      url: state.url, title: state.title,
      playing: state.playing,
      position: Math.max(0, nowPos()),
      sentAt: Date.now()
    });
  }

  channel.on('broadcast', { event: 'state' }, function (m) {
    var p = (m && m.payload) || {};
    if (p.to && p.to !== clientId) return;
    if (!p.url) return;
    gotState = true;
    applyRemote(p);
  });

  channel.on('broadcast', { event: 'cmd' }, function (m) {
    var p = (m && m.payload) || {};
    if (!p.clientId || p.clientId === clientId) return;
    if (p.seq) {
      var prev = peerSeq[p.clientId] || 0;
      if (p.seq <= prev) return;
      peerSeq[p.clientId] = p.seq;
    }
    applyRemote(p);
  });

  channel.on('broadcast', { event: 'beat' }, function (m) {
    var p = (m && m.payload) || {};
    if (p.clientId === clientId) return;
    if (!hasTrack || !p.url || p.url !== state.url) return;
    if (!unlocked) return;
    var lat = Math.max(0, (Date.now() - p.sentAt) / 1000);
    var target = p.position + lat;
    setWant(!!p.playing, target);
    if (p.playing) {
      if (Math.abs((audio.currentTime || 0) - target) > DRIFT) audio.currentTime = target;
      if (audio.paused) tryPlay();
    } else if (!audio.paused) {
      audio.pause();
    }
  });

  /* ---- 감성 리액션: 방 전체에 즉시 전파 ---- */
  channel.on('broadcast', { event: 'react' }, function (m) {
    var p = (m && m.payload) || {};
    if (p.from === clientId) return;
    if (!p.e) return;
    spawnFloat(p.e, null);
  });

  function applyRemote(p) {
    var isNewTrack = !!p.url && p.url !== state.url;
    var lat = Math.max(0, (Date.now() - p.sentAt) / 1000);
    var playing = (p.playing !== undefined) ? !!p.playing : (p.action === 'play');
    var target = Math.max(0, (p.position || 0) + (playing ? lat : 0));

    if (isNewTrack) {
      trackFromPeer = true;
      loadTrack(p.url, p.title || '음악');
    } else if (p.title && p.title !== state.title) {
      state.title = p.title;
      titleEl.textContent = p.title;
    }
    if (!hasTrack) return;

    setWant(playing, target);

    if (isNewTrack || audio.readyState < 1) {
      pendingSeek = target;
    } else if (p.action === 'seek' || Math.abs((audio.currentTime || 0) - target) > DRIFT) {
      audio.currentTime = target;
    }

    if (playing) {
      tryPlay();
    } else {
      audio.pause();
    }
    syncUi();
  }

  channel.subscribe(function (status) {
    if (status === 'SUBSCRIBED') {
      subscribed = true;
      channel.track({ joinedAt: joinedAt, clientId: clientId, at: Date.now() }).then(function () {
        updatePresence();
      })['catch'](function () {});
      while (sendQueue.length) channel.send(sendQueue.shift()).catch(function () {});
      setTimeout(requestState, 500);
      setTimeout(updatePresence, 900);
      presenceEl.classList.remove('offline');
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
      presenceEl.classList.add('offline');
      pcEl.textContent = '·';
      setTimeout(function () { try { channel.subscribe(); } catch (e) {} }, 3000);
    }
  });

  /* ============ audio plumbing ============ */
  function loadTrack(url, title) {
    hasTrack = true;
    state.url = url;
    state.title = title || '음악';
    titleEl.textContent = state.title;
    hintEl.textContent = '모두 같은 위치에서 듣고 있어요';
    playBtn.disabled = false;
    seek.disabled = false;
    saveBtn.disabled = false;
    if (audio.src !== url) {
      audio.src = url;
      audio.load();
    }
  }

  function tryPlay() {
    var pr = audio.play();
    if (pr && pr['catch']) {
      pr['catch'](function () {
        showUnlock();
      });
    }
  }

  function showUnlock() {
    if (!hasTrack) return;
    var emoji = $('unlockEmoji'), h = $('unlockTitle'), bodyEl = $('unlockBody'), go = $('unlockGo');
    if (trackFromPeer) {
      emoji.textContent = '🎧';
      h.textContent = '누군가 지금 이 곡을 듣고 있어요.';
      bodyEl.innerHTML = '《' + esc(state.title || '음악') + '》<br>같은 순간, 함께 하시겠어요?';
      go.textContent = '🔊 소리 켜고 함께 듣기';
    } else {
      emoji.textContent = '🔊';
      h.textContent = '잠깐, 소리만 켜 주세요.';
      bodyEl.innerHTML = '브라우저가 자동 재생을 막았어요.<br>한 번만 탭하면 같은 위치에서 바로 재생돼요.';
      go.textContent = '🔊 소리 켜고 같이 듣기';
    }
    unlockOv.classList.add('on');
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&quot;';
    });
  }

  /* 받침에 맞는 목적격 조사를 고른다 (을/를) */
  function josaEul(word) {
    var s = String(word || '').replace(/[\s》\]\)\.,!?~…"']+$/, '');
    var code = s.charCodeAt(s.length - 1);
    if (code >= 0xAC00 && code <= 0xD7A3) return ((code - 0xAC00) % 28) ? '을' : '를';
    return '을(를)';
  }

  audio.addEventListener('loadedmetadata', function () {
    durEl.textContent = fmt(audio.duration);
    if (pendingSeek !== null) {
      try { audio.currentTime = Math.min(pendingSeek, Math.max(0, (audio.duration || 1e9) - 0.2)); } catch (e) {}
      pendingSeek = null;

    syncUi();
  });
  audio.addEventListener('durationchange', function () { durEl.textContent = fmt(audio.duration); });
  audio.addEventListener('play', function () {
    setWant(true, audio.currentTime);
    unlocked = true;
    unlockOv.classList.remove('on');
    syncUi();
  });

  });
  audio.addEventListener('ended', function () {
    setWant(false, 0);
    audio.currentTime = 0;
    syncUi();
    broadcastState('pause', { position: 0 });
  });
  audio.addEventListener('error', function () {
    if (!hasTrack) return;
    hintEl.textContent = '이 곡을 재생할 수 없어요. 다른 파일로 다시 시도해 주세요.';
  });
  audio.addEventListener('timeupdate', function () { if (!scrubbing) paintProgress(); });

  function paintProgress() {
    var d = isFinite(audio.duration) ? audio.duration : 0;
    var c = audio.currentTime || 0;
    var pct = d > 0 ? (c / d) * 100 : 0;
    if (!scrubbing) seek.value = String(Math.round(pct * 10));
    seek.style.setProperty('--p', pct.toFixed(2) + '%');
    curEl.textContent = fmt(c);
    if (d > 0) durEl.textContent = fmt(d);
  }

  function syncUi() {
    var playing = !audio.paused && hasTrack;
    playBtn.classList.toggle('is-playing', playing);
    playBtn.setAttribute('aria-label', playing ? '일시정지' : '재생');
    art.classList.toggle('playing', playing);
    document.body.classList.toggle('playing', playing);
    badge.textContent = playing ? '같이 듣는 중' : (hasTrack ? '일시정지' : '대기 중');
    glyph.textContent = playing ? '🎶' : '🎵';
  }

  /* ============ user controls ============ */
  playBtn.addEventListener('click', function () {
    if (!hasTrack) return;
    unlocked = true;
    if (audio.paused) {
      tryPlay();
      setWant(true, audio.currentTime);
      setTimeout(function () { broadcastState('play'); }, 60);
    } else {
      audio.pause();
      setWant(false, audio.currentTime);
      broadcastState('pause');
    }
    syncUi();
  });

  function nudge(delta) {
    if (!hasTrack) return;
    var d = isFinite(audio.duration) ? audio.duration : 0;
    var t = Math.max(0, Math.min((audio.currentTime || 0) + delta, d ? d - 0.15 : 1e9));
    audio.currentTime = t;
    setWant(!audio.paused, t);
    paintProgress();
    broadcastState('seek', { position: t });
  }
  $('b15').addEventListener('click', function () { nudge(-15); });
  $('f15').addEventListener('click', function () { nudge(15); });

  seek.addEventListener('pointerdown', function () { scrubbing = true; });
  seek.addEventListener('input', function () {
    scrubbing = true;
    var d = isFinite(audio.duration) ? audio.duration : 0;
    var pct = Number(seek.value) / 10;
    seek.style.setProperty('--p', pct.toFixed(2) + '%');
    curEl.textContent = fmt(d * pct / 100);
  });
  function commitSeek() {
    if (!hasTrack) return;
    var d = isFinite(audio.duration) ? audio.duration : 0;
    var pct = Number(seek.value) / 10;
    var t = Math.max(0, Math.min(d * pct / 100, d ? d - 0.1 : 1e9));
    audio.currentTime = t;
    setWant(!audio.paused, t);
    scrubbing = false;
    broadcastState('seek', { position: t });
    paintProgress();
  }
  seek.addEventListener('change', commitSeek);
  seek.addEventListener('pointerup', function () { if (scrubbing) commitSeek(); });

  /* ============ unlock overlay ============ */
  $('unlockGo').addEventListener('click', function () {
    unlocked = true;
    unlockOv.classList.remove('on');
    var target = nowPos();
    try {
      if (Math.abs((audio.currentTime || 0) - target) > DRIFT) audio.currentTime = Math.min(target, Math.max(0, (audio.duration || 1e9) - 0.2));
    } catch (e) {}
    if (state.playing) tryPlay();
    requestState();
  });
  $('unlockSkip').addEventListener('click', function () { unlockOv.classList.remove('on'); });

  /* ============ 감성 리액션 ============ */
  reactRow.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.react') : null;
    if (!btn) return;
    var emoji = btn.getAttribute('data-e');
    if (!emoji) return;
    spawnFloat(emoji, btn);
    send('react', { e: emoji, from: clientId, at: Date.now() });
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} }
  });

  function spawnFloat(emoji, btn) {
    if (!floaters) return;
    while (floaters.children.length > 24) floaters.removeChild(floaters.firstChild);
    var r;
    try { r = (btn || reactRow).getBoundingClientRect(); } catch (e) { return; }
    if (!r || !r.width) r = { left: window.innerWidth / 2, top: window.innerHeight - 200, width: 0, height: 0 };
    var x = r.left + r.width / 2 + (Math.random() * 2 - 1) * 78;
    var y = r.top + r.height / 2;
    var el = document.createElement('span');
    el.className = 'float';
    el.textContent = emoji;
    el.style.left = Math.max(24, Math.min(window.innerWidth - 24, x)) + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--dx', ((Math.random() * 2 - 1) * 46).toFixed(0) + 'px');
    el.style.setProperty('--sc', (0.82 + Math.random() * 0.42).toFixed(2));
    el.style.animationDuration = (2.4 + Math.random() * 0.9).toFixed(2) + 's';
    floaters.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3600);
  }

  /* ============ 곡 다운로드 (호스트·게스트 공용) ============ */
  var SAVE_LABEL = '⬇️ 이 곡 저장';
  var saving = false;

  function saveFileName() {
    var base = (state.title || '음악').replace(/[\\\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60) || '음악';
    var path = (state.url || '').split('?')[0].split('#')[0];
    var m = /\.([a-z0-9]{2,5})$/i.exec(path);
    var ext = m ? m[1].toLowerCase() : 'mp3';
    if (ext === 'oga') ext = 'ogg';
    return base + '.' + ext;
  }

  function saveBusyText(txt) {
    saveBtn.innerHTML = '<span class="spin" aria-hidden="true"></span><span>' + txt + '</span>';
  }
  function saveIdle() {
    saving = false;
    saveBtn.classList.remove('busy');
    saveBtn.removeAttribute('aria-busy');
    saveBtn.innerHTML = SAVE_LABEL;
  }

  function triggerAnchor(href, download, newTab) {
    var a = document.createElement('a');
    a.href = href;
    if (download) a.download = download;
    a.rel = 'noopener';
    if (newTab) a.target = '_blank';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, 1500);
  }

  function saveFallback(fname) {
    // Supabase Storage: ?download=파일명 → Content-Disposition: attachment
    var sep = state.url.indexOf('?') > -1 ? '&' : '?';
    triggerAnchor(state.url + sep + 'download=' + encodeURIComponent(fname), fname, true);
    toast('⬇️ 다운로드를 시작했어요 · ' + fname);
  }

  function downloadTrack() {
    if (!hasTrack || saving) return;
    var fname = saveFileName();
    saving = true;
    saveBtn.classList.add('busy');
    saveBtn.setAttribute('aria-busy', 'true');
    saveBusyText('저장 중…');

    function fail() {
      saveIdle();
      saveFallback(fname);
    }

    var req;
    try {
      req = fetch(state.url, { cache: 'force-cache', mode: 'cors' });
    } catch (e) {
      fail(); return;
    }

    req.then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var total = Number(res.headers.get('content-length') || 0);
      var ctype = res.headers.get('content-type') || 'audio/mpeg';
      if (!res.body || !res.body.getReader || !total) return res.blob();
      var reader = res.body.getReader(), chunks = [], got = 0;
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) return new Blob(chunks, { type: ctype });
          chunks.push(r.value);
          got += r.value.length;
          var pct = Math.min(99, Math.round((got / total) * 100));
          saveBusyText('저장 중… ' + pct + '%');
          return pump();
        });
      })();
    }).then(function (blob) {
      if (!blob || !blob.size) throw new Error('empty blob');
      if (!('download' in document.createElement('a'))) throw new Error('no download attr');
      var url = URL.createObjectURL(blob);
      triggerAnchor(url, fname, false);
      setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
      saveIdle();
      toast('⬇️ ' + fname + ' 저장했어요');
    })['catch'](function (err) {
      fail();
    });
  }

  saveBtn.addEventListener('click', downloadTrack);

  /* ============ upload ============ */
  $('pick').addEventListener('click', function () { fileInput.click(); });

  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    if (!/^audio\//i.test(f.type || '') && !/\.(mp3|m4a|aac|wav|ogg|oga|flac|opus|weba|mp4)$/i.test(f.name)) {
      toast('음악 파일만 올릴 수 있어요');
      return;
    }
    if (f.size > MAX_BYTES) {
      toast('30MB 이하 파일만 올릴 수 있어요');
      return;
    }
    upload(f);
  });

  function upload(file) {
    var ext = (file.name.split('.').pop() || 'mp3').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'mp3';
    var path = room + '/' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
    var url = SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path;
    var ctype = file.type && /^audio\//i.test(file.type) ? file.type : 'audio/mpeg';

    uploadBox.classList.add('on');
    barfill.style.width = '0%';
    uppct.textContent = '0%';
    uptext.textContent = '업로드 중…';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON);
    xhr.setRequestHeader('apikey', SUPABASE_ANON);
    xhr.setRequestHeader('Content-Type', ctype);
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.setRequestHeader('cache-control', '3600');

    xhr.upload.onprogress = function (e) {
      if (!e.lengthComputable) return;
      var pct = Math.round((e.loaded / e.total) * 100);
      barfill.style.width = pct + '%';
      uppct.textContent = pct + '%';
      uptext.textContent = pct < 100 ? '업로드 중…' : '마무리 중…';
    };

    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) {
        var publicUrl = SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/' + path;
        var title = cleanName(file.name);
        barfill.style.width = '100%';
        uppct.textContent = '100%';
        uptext.textContent = '방에 올렸어요 ✓';
        setTimeout(function () { uploadBox.classList.remove('on'); }, 1800);

        unlocked = true;
        trackFromPeer = false;
        loadTrack(publicUrl, title);
        pendingSeek = 0;
        setWant(true, 0);
        tryPlay();
        broadcastState('play', { url: publicUrl, title: title, position: 0, playing: true });
        toast('모두에게 곡을 보냈어요');
      } else {
        failUpload('업로드 실패 (' + xhr.status + ')');
      }
    };
    xhr.onerror = function () { failUpload('네트워크 오류로 업로드하지 못했어요'); };
    xhr.ontimeout = function () { failUpload('시간이 초과됐어요'); };
    xhr.timeout = 180000;
    xhr.send(file);
  }

  function failUpload(msg) {
    uptext.textContent = msg;
    uppct.textContent = '';
    barfill.style.width = '0%';
    toast(msg);
    setTimeout(function () { uploadBox.classList.remove('on'); }, 3200);
  }

  /* ============ invite ============ */
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('on'); }, 2400);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (res, rej) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? res() : rej(new Error('copy failed'));
      } catch (e) { rej(e); }
    });
  }

  /* 감성 초대 문구: 곡이 있으면 그 곡을, 없으면 기다리는 마음을 담는다 */
  function inviteLines() {
    if (hasTrack && state.title) {
      return [
        '🎵 지금 《' + state.title + '》' + josaEul(state.title) + ' 듣고 있어요.',
        '같은 순간, 함께 들으실래요?'
      ];
    }
    return [
      '🌙 지금 같이 듣기 방에서 기다리고 있어요.',
      '같은 노래, 함께 들으실래요?'
    ];
  }
  function inviteText() {
    return inviteLines().concat([shareLink()]).join('\n');
  }

  $('copy').addEventListener('click', function () {
    copyText(inviteText()).then(function () {
      toast('💌 초대 문구와 링크를 복사했어요');
    })['catch'](function () {
      toast('링크: ' + shareLink());
    });
  });

  if (navigator.share) {
    var shareBtn = $('share');
    shareBtn.style.display = '';
    shareBtn.addEventListener('click', function () {
      navigator.share({
        title: '같이 듣기 · 방 ' + room,
        text: inviteLines().join('\n'),
        url: shareLink()
      })['catch'](function () {});
    });
  }

  /* ============ join another room ============ */
  $('joinOpen').addEventListener('click', function () {
    $('sheet').classList.add('on');
    setTimeout(function () { $('codeInput').focus(); }, 120);
  });
  $('sheet').addEventListener('click', function (e) {
    if (e.target === $('sheet')) $('sheet').classList.remove('on');
  });
  function joinRoom() {
    var c = ($('codeInput').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length < 4) { toast('방 코드를 확인해 주세요'); return; }
    location.href = location.origin + location.pathname + '?room=' + c;
  }
  $('joinGo').addEventListener('click', joinRoom);
  $('codeInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') joinRoom(); });

  /* ============ heartbeat (leader only) ============ */
  setInterval(function () {
    if (!subscribed || !hasTrack || !unlocked) return;
    computeLeader();
    if (leaderId !== clientId) return;
    if (audio.paused) return;
    var t = Date.now();
    if (t - lastBeatAt < BEAT_MS) return;
    lastBeatAt = t;
    send('beat', {
      clientId: clientId,
      url: state.url,
      playing: !audio.paused,
      position: audio.currentTime || 0,
      sentAt: Date.now()
    });
  }, 1200);

  /* ============ periodic drift guard ============ */
  setInterval(function () {
    if (!hasTrack || !unlocked) return;
    if (leaderId === clientId) return;
    var st = channel.presenceState() || {};
    if (!Object.keys(st).length) return;
    var target = nowPos();
    var d = isFinite(audio.duration) ? audio.duration : 0;
    if (d && target > d - 0.5) return;
    if (state.playing && audio.paused) tryPlay();
    if (Math.abs((audio.currentTime || 0) - target) > 1.5) audio.currentTime = Math.max(0, target);
  }, 2500);

  /* ============ lifecycle ============ */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && unlocked) requestState();
  });
  window.addEventListener('pagehide', function () { try { channel.untrack(); } catch (e) {} });

  paintProgress();
  syncUi();
  updatePresence();
})();
</script>
</body>
</html>
