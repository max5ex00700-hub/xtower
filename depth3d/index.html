<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Depth3D</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="app">

  <div class="backdrop" aria-hidden="true">
    <div class="halo halo-a"></div>
    <div class="halo halo-b"></div>
    <div class="vignette"></div>
  </div>

  <canvas id="gl"></canvas>

  <header class="top" id="top">
    <div class="brand">
      <div class="brand-line">
        <span class="mark"></span>
        <h1>Depth3D</h1>
        <span class="rev">2.5D</span>
      </div>
      <div class="byline">제작: 포시즌jo</div>
    </div>
    <div class="top-right">
      <span class="offline">OFFLINE</span>
      <button class="icon-btn" id="btn-immersive" aria-label="몰입 모드">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="hint" id="hint">
    <span class="hint-dot"></span>
    끌어서 좌우·상하로 기울여 보세요
  </div>

  <section class="sheet" id="sheet">
    <div class="grip" id="grip"></div>

    <div class="sheet-head">
      <canvas class="depth-thumb" id="depth-thumb" width="72" height="96"></canvas>
      <div class="caption">
        <span class="caption-name" id="photo-name">샘플 포트레이트</span>
        <span class="caption-meta" id="photo-meta">기기 안에서 깊이를 계산합니다</span>
      </div>
      <button class="ghost" id="btn-collapse">접기</button>
    </div>

    <div class="sources" id="sources">
      <button class="btn primary" id="btn-open">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <span>사진 불러오기</span>
      </button>
      <button class="btn sample" data-sample="0">
        <span class="thumb" id="thumb-0"></span><span>샘플 A</span>
      </button>
      <button class="btn sample" data-sample="1">
        <span class="thumb" id="thumb-1"></span><span>샘플 B</span>
      </button>
    </div>

    <div class="sliders" id="sliders">
      <div class="slider">
        <div class="slabel"><span>입체 깊이</span><span class="sval" id="v-depth">62%</span></div>
        <input type="range" id="s-depth" min="0" max="100" value="62" step="1" />
      </div>
      <div class="slider">
        <div class="slabel"><span>표면 부드러움</span><span class="sval" id="v-smooth">48%</span></div>
        <input type="range" id="s-smooth" min="0" max="100" value="48" step="1" />
      </div>
      <div class="slider">
        <div class="slabel"><span>빛 각도</span><span class="sval" id="v-light">-32°</span></div>
        <input type="range" id="s-light" min="-90" max="90" value="-32" step="1" />
      </div>
      <div class="slider">
        <div class="slabel"><span>빛 강도</span><span class="sval" id="v-power">78%</span></div>
        <input type="range" id="s-power" min="0" max="100" value="78" step="1" />
      </div>
    </div>

    <div class="chips" id="chips">
      <button class="chip" id="t-sway"><i></i>자동 스웨이</button>
      <button class="chip" id="t-gyro"><i></i>기울기 센서</button>
      <button class="chip" id="t-center"><i></i>중앙 복귀</button>
      <button class="chip" id="t-invert"><i></i>볼록·오목</button>
    </div>

    <div class="sheet-foot">
      <span class="pip"></span>인터넷 없이 기기 안에서만 동작합니다
    </div>
  </section>

  <button class="restore" id="btn-restore">컨트롤</button>

  <div class="loader" id="loader" aria-hidden="true">
    <div class="ring"></div>
    <div class="loader-text" id="loader-text">깊이 맵 계산 중</div>
    <div class="loader-bar"><i id="loader-fill"></i></div>
  </div>

  <div class="toast" id="toast"></div>

  <input type="file" id="file" accept="image/*" hidden />
</div>

<script src="three.min.js"></script>
<script src="samples.js"></script>
<script src="depth.js"></script>
<script src="viewer.js"></script>
<script src="ui.js"></script>
</body>
</html>
