plugins { id 'com.android.application' }

android {
    namespace 'com.xtower.engine'
    compileSdk 35
    defaultConfig {
        applicationId "com.xtower.game"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "0.4.0"
    }
    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { minifyEnabled false }
    }
}
