plugins { id 'com.android.application' }

android {
    namespace 'com.xtower.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.xtower.game.native"
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName "1.0.0-native"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
