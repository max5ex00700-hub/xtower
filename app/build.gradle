plugins { id 'com.android.application' }

android {
    namespace 'com.xtower.engine'
    compileSdk 35

    defaultConfig {
        applicationId "com.xtower.game.nativeengine"
        minSdk 24
        targetSdk 35
        versionCode 1051
        versionName "native-10.51"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
