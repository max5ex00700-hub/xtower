plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thumb.rhythm.audiotest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thumb.rhythm.audiotest'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0-native-audio-test'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -O3 -ffast-math'
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
